<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — Banashri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="main-nav"></nav>

  <div id="mobile-menu"></div>

  <section class="gallery-section">
    <h2 class="section-title">Photos</h2>
    <p class="section-subtitle">Moments captured along the way.</p>

    <div class="gallery-grid">

      <!-- PHOTO TEMPLATE — copy this block to add a new photo:
      <div class="gallery-item">
        <img src="images/photos/YOUR-PHOTO.jpg" alt="Description" loading="lazy">
      </div>
      -->

      <div class="gallery-item">
        <img src="https://6aa6c6759422e77b387df94a.imgix.net/italien/1.jpg" alt="Mountain landscape" loading="lazy">
      </div>
      <div class="gallery-item tall">
        <img src="https://6aa6c6759422e77b387df94a.imgix.net/italien/2.jpg" alt="Forest path" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="https://6aa6c6759422e77b387df94a.imgix.net/italien/3.jpg" alt="Beach sunset" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="https://6aa6c6759422e77b387df94a.imgix.net/italien/4.jpg" alt="Starry night mountains" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="https://6aa6c6759422e77b387df94a.imgix.net/italien/5.jpg" alt="Lake reflection" loading="lazy">
      </div>

    </div>
  </section>

  <footer id="main-footer"></footer>

  <script src="js/components.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
